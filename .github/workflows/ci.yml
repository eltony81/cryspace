name: CI
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
    - run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
    - run: shards install
    - run: crystal spec -Dopenblas
