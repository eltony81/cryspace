name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: latest

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liblapack-dev libopenblas-dev
        
        # Brute force fix for -lcblas not being found
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libopenblas.so /usr/lib/x86_64-linux-gnu/libcblas.so

    - name: Install shards
      run: shards install

    - name: Run tests
      run: crystal spec
